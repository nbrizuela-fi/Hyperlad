exec = gsettings set org.gnome.desktop.interface gtk-theme 'Wallbash-Gtk'
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    col.active_border = rgba(F7D46Eff) rgba(524729ff) 45deg
    col.inactive_border = rgba(454E54ff) rgba(CEAD87ff) 45deg
}

group {
    col.border_active = rgba(F7D46Eff) rgba(524729ff) 45deg
    col.border_inactive = rgba(454E54cc) rgba(CEAD87cc) 45deg
    col.border_locked_active = rgba(060707ff) rgba(0B0C0Dff) 45deg
    col.border_locked_inactive = rgba(FFFFFFcc) rgba(0D0D0Ecc) 45deg
}
